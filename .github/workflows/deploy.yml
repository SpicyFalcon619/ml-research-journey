name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Build field guide
        working-directory: webapp
        run: npm run build
        env:
          # The assistant's Groq key, from the repository's Actions secrets (never committed). Visitors are
          # never asked for a key; with neither secret the assistant is simply switched off.
          VITE_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          # A second provider (Google Gemini), with its own separate free limit. Either key alone is enough.
          VITE_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Keep the existing roadmap page at its current URL
        run: cp ml-research-roadmap.html webapp/dist/ml-research-roadmap.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
