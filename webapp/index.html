    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A searchable personal field guide to every Python, NumPy, Pandas, and scikit-learn snippet from the ML Research trail." />
    <title>Field Guide · ML Research</title>
    <script>
      (function () {
        // Keep the ids in sync with src/lib/theme.ts.
        try {
          var stored = window.localStorage.getItem('mlfg-theme')
          var known = ['dark', 'vesper', 'light', 'midnight', 'paper', 'terminal', 'expedition']
          var theme = 'dark'
          if (stored === 'system') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          } else if (known.indexOf(stored) !== -1) {
            theme = stored
          }
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-bg', window.localStorage.getItem('mlfg-bg') === 'off' ? 'off' : 'on')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
